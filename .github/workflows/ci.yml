name: war CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build WAR file with Maven
        run: mvn clean package

      - name: Upload WAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: target/*.war
